version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: basis-forum-db
    restart: always
    environment:
      POSTGRES_USER: basis_user
      POSTGRES_PASSWORD: basis_password
      POSTGRES_DB: basis_forum
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
